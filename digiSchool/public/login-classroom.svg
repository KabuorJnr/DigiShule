<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A teacher tutoring students in a Kenyan classroom">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf3fa"/><stop offset="1" stop-color="#dbe6f3"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8bd93"/><stop offset="1" stop-color="#c4a271"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0f5"/><stop offset="1" stop-color="#e4f2fc"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5749"/><stop offset="1" stop-color="#21433a"/>
    </linearGradient>
  </defs>

  <!-- room -->
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect y="700" width="1600" height="300" fill="url(#floor)"/>
  <rect y="694" width="1600" height="8" fill="#b89a6c"/>

  <!-- window with sky -->
  <g>
    <rect x="1150" y="120" width="330" height="300" rx="8" fill="#c19a63"/>
    <rect x="1166" y="136" width="298" height="268" fill="url(#sky)"/>
    <circle cx="1240" cy="205" r="28" fill="#ffd766"/>
    <path d="M1166 372 q70 -56 156 -22 q78 30 142 -4 v58 h-298z" fill="#8fca86"/>
    <rect x="1310" y="136" width="10" height="268" fill="#c19a63"/>
    <rect x="1166" y="266" width="298" height="10" fill="#c19a63"/>
  </g>

  <!-- clock -->
  <g transform="translate(1030,150)">
    <circle r="34" fill="#fff" stroke="#c7d0dc" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="6" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <circle r="4" fill="#334155"/>
  </g>

  <!-- Kenyan flag -->
  <g transform="translate(120,120)">
    <rect x="-8" y="-8" width="216" height="136" rx="8" fill="#ffffff"/>
    <rect width="200" height="40" fill="#000000"/>
    <rect y="40" width="200" height="10" fill="#ffffff"/>
    <rect y="50" width="200" height="30" fill="#be3a34"/>
    <rect y="80" width="200" height="10" fill="#ffffff"/>
    <rect y="90" width="200" height="30" fill="#3a7d44"/>
    <g transform="translate(100,60)">
      <rect x="-3" y="-40" width="6" height="80" fill="#7a4a1e"/>
      <ellipse rx="15" ry="32" fill="#b3231d" stroke="#fff" stroke-width="3"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#fff" stroke-width="3"/>
    </g>
  </g>

  <!-- chalkboard -->
  <g transform="translate(470,150)">
    <rect x="-16" y="-16" width="632" height="352" rx="12" fill="#6f4e2e"/>
    <rect width="600" height="320" rx="5" fill="url(#board)"/>
    <text x="40" y="66" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="46" fill="#ffd76a">Karibu Shule</text>
    <line x1="40" y1="86" x2="330" y2="86" stroke="#ffd76a" stroke-width="4" stroke-linecap="round"/>
    <text x="44" y="196" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="52" fill="#eef4ef">2 + 2 = 4</text>
    <text x="44" y="270" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="40" fill="#cfe8dd">A  B  C  D</text>
    <g stroke="#eef4ef" stroke-width="5" stroke-linecap="round" fill="none">
      <circle cx="470" cy="150" r="30"/>
      <path d="M470 92 v-20 M470 208 v20 M412 150 h-20 M528 150 h20 M428 108 l-14 -14 M512 192 l14 14 M512 108 l14 -14 M428 192 l-14 14"/>
    </g>
  </g>

  <!-- teacher tutoring, pointing at the board -->
  <g transform="translate(250,352)">
    <ellipse cx="70" cy="404" rx="86" ry="18" fill="#000" opacity="0.12"/>
    <!-- pointer stick to the board -->
    <line x1="150" y1="70" x2="322" y2="8" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/>
    <!-- legs -->
    <rect x="46" y="300" width="22" height="96" rx="8" fill="#3a2c22"/>
    <rect x="80" y="300" width="22" height="96" rx="8" fill="#3a2c22"/>
    <rect x="40" y="386" width="36" height="16" rx="7" fill="#241a17"/>
    <rect x="76" y="386" width="36" height="16" rx="7" fill="#241a17"/>
    <!-- dress -->
    <path d="M30 150 q44 -34 88 0 l20 158 h-128 z" fill="#e08a2e"/>
    <path d="M30 150 q44 -34 88 0 l6 46 q-50 22 -100 0 z" fill="#c9761f"/>
    <!-- pointing arm -->
    <path d="M104 168 q60 -46 150 -96" stroke="#8a5a34" stroke-width="17" fill="none" stroke-linecap="round"/>
    <!-- resting arm -->
    <path d="M44 168 q-14 44 -6 92" stroke="#8a5a34" stroke-width="17" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="74" cy="86" r="36" fill="#8a5a34"/>
    <path d="M38 78 a36 36 0 0 1 72 0 q-36 -26 -72 0z" fill="#241a14"/>
    <circle cx="74" cy="52" r="40" fill="none"/>
  </g>

  <!-- students seated, backs to viewer, facing the board -->
  <g>
    <!-- student A -->
    <g transform="translate(470,690)">
      <ellipse cx="30" cy="150" rx="96" ry="20" fill="#000" opacity="0.12"/>
      <path d="M-46 96 q76 -104 152 0 z" fill="#2f9e6f"/>
      <circle cx="30" cy="20" r="38" fill="#7a4a28"/>
      <path d="M-8 12 a38 38 0 0 1 76 0 q-38 -24 -76 0z" fill="#201510"/>
      <rect x="-96" y="96" width="252" height="20" rx="5" fill="#b98a52"/>
      <rect x="-84" y="116" width="18" height="86" fill="#95662f"/>
      <rect x="138" y="116" width="18" height="86" fill="#95662f"/>
    </g>
    <!-- student B (center, slightly forward) -->
    <g transform="translate(760,730)">
      <ellipse cx="34" cy="168" rx="108" ry="22" fill="#000" opacity="0.12"/>
      <path d="M-52 108 q86 -116 172 0 z" fill="#c94f3d"/>
      <circle cx="34" cy="22" r="42" fill="#8a5a34"/>
      <path d="M-8 14 a42 42 0 0 1 84 0 q-42 -26 -84 0z" fill="#241a14"/>
      <rect x="-108" y="108" width="284" height="22" rx="6" fill="#c1935a"/>
      <rect x="-94" y="130" width="20" height="96" fill="#9c6c33"/>
      <rect x="156" y="130" width="20" height="96" fill="#9c6c33"/>
    </g>
    <!-- student C -->
    <g transform="translate(1080,700)">
      <ellipse cx="30" cy="150" rx="96" ry="20" fill="#000" opacity="0.12"/>
      <path d="M-46 96 q76 -104 152 0 z" fill="#3b6fd4"/>
      <circle cx="30" cy="20" r="38" fill="#9c6b3f"/>
      <path d="M-8 12 a38 38 0 0 1 76 0 q-38 -24 -76 0z" fill="#2b1d14"/>
      <rect x="-96" y="96" width="252" height="20" rx="5" fill="#b98a52"/>
      <rect x="-84" y="116" width="18" height="86" fill="#95662f"/>
      <rect x="138" y="116" width="18" height="86" fill="#95662f"/>
    </g>
  </g>

  <!-- potted plant -->
  <g transform="translate(1440,560)">
    <path d="M-30 40 h60 l-8 90 h-44 z" fill="#c96f3a"/>
    <path d="M0 40 q-46 -30 -34 -86 q30 20 34 60 q4 -46 40 -66 q6 46 -40 92z" fill="#3f9a5c"/>
  </g>
</svg>
